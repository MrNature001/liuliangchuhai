[project]
name = "liuliangchuhai-api"
version = "0.1.0"
description = "Phase 0 API architecture and provider extension points"
requires-python = ">=3.12"
dependencies = [
    "edge-tts>=7,<8",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "imageio-ffmpeg>=0.6,<1",
    "pillow>=11,<12",
    "pydantic-settings>=2.10,<3",
    "uvicorn[standard]>=0.35,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liuliangchuhai"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "import-linter>=2.3,<3",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Demo copy is intentionally multilingual: CJK punctuation and typographic
# dashes are the correct characters, not ambiguous confusables. The mock
# adapters carry the same Chinese system/off-limits copy as the live provider.
"**/mock.py" = ["RUF001", "RUF002", "RUF003", "E501"]
"**/deepseek.py" = ["RUF001", "RUF002", "RUF003"]
# Caption splitting and voice routing are defined over CJK/Thai punctuation.
"**/digital_human/timeline.py" = ["RUF001", "RUF002", "RUF003"]
"**/digital_human/speech.py" = ["RUF001", "RUF002", "RUF003"]
# Line breaking is defined over CJK/Thai punctuation too.
"**/digital_human/poster.py" = ["RUF001", "RUF002", "RUF003"]
"**/tests/unit/test_presenter_*.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/liuliangchuhai"]

[[tool.mypy.overrides]]
module = ["imageio_ffmpeg", "edge_tts.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[tool.importlinter]
root_package = "liuliangchuhai"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["liuliangchuhai.domain"]
forbidden_modules = [
    "liuliangchuhai.application",
    "liuliangchuhai.infrastructure",
    "liuliangchuhai.presentation",
    "liuliangchuhai.bootstrap",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Application does not depend on outer layers"
type = "forbidden"
source_modules = ["liuliangchuhai.application"]
forbidden_modules = [
    "liuliangchuhai.infrastructure",
    "liuliangchuhai.presentation",
    "liuliangchuhai.bootstrap",
    "fastapi",
    "pydantic",
    "pydantic_settings",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Presentation does not depend on infrastructure or bootstrap"
type = "forbidden"
source_modules = ["liuliangchuhai.presentation"]
forbidden_modules = [
    "liuliangchuhai.infrastructure",
    "liuliangchuhai.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Infrastructure does not depend on presentation or bootstrap"
type = "forbidden"
source_modules = ["liuliangchuhai.infrastructure"]
forbidden_modules = [
    "liuliangchuhai.presentation",
    "liuliangchuhai.bootstrap",
]
